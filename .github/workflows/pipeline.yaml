name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest   # Fixed: "ububtu-latest" → "ubuntu-latest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # Recommended: use v4 (v5 doesn't exist yet as of Nov 2025)

      - name: Set up Node.js     # Fixed typo: "Node.jobs" → "Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'     # or better: '18.x' or use 20/22 if your project supports it
          cache: 'npm'           # Highly recommended: speeds up installs dramatically

      - name: Install dependencies
        run: npm ci                # Better than `npm install` in CI (reproducible installs)

      - name: Run Tests
        run: npm test